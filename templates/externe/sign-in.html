{% load static %}

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Api de Paiement</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />
  </head>
  <body>
    <!-- ----------------- -->
    <section class="home">
      <div class="form_container">
        <!-- Login form -->
        <div class="form login_form">
          <form method="post" action="">
            {% csrf_token %}
            <h2>Se connecter</h2>
            <div class="input_box">
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Email"
                required
              />
              <i class="uil uil-envelope-alt email"></i>
            </div>
            <div class="input_box">
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Mot de passe"
                required
              />
              <i class="uil uil-lock password"></i>
              <i class="uil uil-eye-slash password_icon"></i>
            </div>

            <div class="option_field">
              <span class="checkbox">
                <input type="checkbox" id="check" />
                <label for="check">Souviens-toi de moi</label>
              </span>
              <a href="" class="forgot_pw">Mot de passe oublié ?</a>
            </div>
            <input type="hidden" name="action" value="login" />

            <button
              style="color: white"
              class="button"
              name="signup"
              type="submit"
            >
              Connectez-vous maintenant
            </button>

            <!-- <div class="login_signup">
          Vous n'avez pas de compte ?
          <a href="{% url 'userAuth:register' %}" id="signup">S'inscrire</a>
        </div> -->
          </form>
        </div>
      </div>
    </section>

    <!-- Script-->
    <script src="{% static 'assets/js/scriptLog.js' %}"></script>

    <script src="{% static 'assets/js/script.js' %}"></script>
  </body>
</html>
