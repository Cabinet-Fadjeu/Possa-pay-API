{% extends 'partials/base.html' %} {% load static %} {% block content %}
<div class="container">
  <aside class="sidebar">
    <h2>Services</h2>
    <ul id="service-list">
      {% for service in services %}
      <li data-id="{{ service.id }}">{{ service.name }}</li>
      {% endfor %}
    </ul>
  </aside>

  <main class="dashboard">
    <div class="dashboard-header">
      <h1>Services Dashboard</h1>
      <button class="btn">+ Create Service</button>
    </div>
    <section class="card" id="service-details">
      <h2 id="service-name">Sélectionnez un service</h2>
      <p class="balance" id="service-balance">$0.00</p>
      <div class="api-key">
        <input type="password" id="apiKey" value="MySecretAPIKey" disabled />
        <button onclick="toggleApiKey()">👁️</button>
        <button onclick="copyApiKey()">📋</button>
      </div>
      <h3>Recent Transactions</h3>
      <ul class="transactions" id="service-transactions">
        <li>Aucune transaction disponible</li>
      </ul>
    </section>
  </main>
</div>

<!-- ✅ Conteneur JSON pour JavaScript -->
<script id="services-data" type="application/json">
  {{ services|safe }}
</script>

<script src="{% static 'js/service_dashboard.js' %}"></script>
{% endblock content %}
